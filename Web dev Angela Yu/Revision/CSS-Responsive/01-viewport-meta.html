<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 
    1. The Viewport Meta Tag
    Without this tag, mobile browsers will pretend they are desktop browsers 
    (zoomed far out). ALWAYS include this in every HTML file!
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .box { background: #4CAF50; color: white; padding: 20px; font-size: 24px; }
  </style>
</head>
<body>
  <h1>The Viewport Tag</h1>
  <p>Open this on your phone (or in browser DevTools Mobile View). Because of the viewport meta tag, the text is readable and doesn't look like a zoomed-out desktop site.</p>
  <div class="box">I look great on mobile!</div>
</body>
</html>
