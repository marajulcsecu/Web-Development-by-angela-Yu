<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      4. Borders & Border Radius
      Border takes 3 values: thickness, style (solid, dashed, dotted), color.
      Border-radius makes the corners rounded.
    */
    .card {
      border: 4px dashed #ff9800; /* 4px thick, dashed style, orange color */
      border-radius: 15px;        /* Rounds the corners by 15px */
      padding: 30px;
      text-align: center;
      background-color: #fff3e0;
    }
    
    .circle {
      width: 100px;
      height: 100px;
      background-color: #e91e63;
      border-radius: 50%; /* 50% radius on a square makes a perfect circle */
    }
  </style>
</head>
<body>
  <h1>Borders and Rounded Corners</h1>
  <div class="card">
    I have a dashed border and rounded corners!
  </div>
  <br>
  <div class="circle"></div>
</body>
</html>
