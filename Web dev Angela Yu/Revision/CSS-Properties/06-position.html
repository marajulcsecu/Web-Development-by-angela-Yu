<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      6. Position
      How elements are placed on the page.
      - relative: moved relative to its normal position.
      - absolute: moved relative to its closest positioned parent.
      - fixed: stays in the exact same spot even when scrolling.
    */
    p { margin-bottom: 20px; }
    
    .relative-box {
      position: relative;
      top: 20px;   /* Pushed 20px down from where it normally sits */
      left: 30px;  /* Pushed 30px right */
      background: yellow;
      padding: 10px;
    }

    .parent {
      position: relative; /* Acts as the anchor for the absolute child */
      width: 300px; height: 150px; background: #ddd; margin-top: 50px;
    }
    
    .absolute-box {
      position: absolute;
      bottom: 0; right: 0; /* Sticks to the bottom-right of the nearest relative parent */
      background: red; color: white; padding: 10px;
    }
  </style>
</head>
<body>
  <h1>Position property</h1>
  
  <div class="relative-box">I am Position: Relative (nudged down and right).</div>
  
  <div class="parent">
    I am a relative parent.
    <div class="absolute-box">Position: Absolute (Bottom Right)</div>
  </div>
</body>
</html>
