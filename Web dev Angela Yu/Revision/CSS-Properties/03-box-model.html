<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      3. The Box Model (Padding, Margin, Width, Height)
      - Margin: Invisible space OUTSIDE the border.
      - Padding: Space INSIDE the border, pushing content inward.
      - box-sizing: border-box: Ensures padding doesn't make the width bigger.
    */
    * {
      box-sizing: border-box; /* Crucial for predictable sizing */
    }
    .box {
      width: 300px;
      height: 150px;
      background-color: lightgreen;
      
      /* Padding: Space inside (green area gets bigger if no border-box) */
      padding: 20px;
      
      /* Margin: Space outside (pushes other elements away) */
      margin: 40px; 
      
      border: 5px solid darkgreen;
    }
  </style>
</head>
<body>
  <h1>The Box Model</h1>
  <p>The padding is inside the border, margin is outside.</p>
  <div class="box">
    I am 300px wide, but I have 20px of padding pushing me inward, and 40px of margin pushing me away from the edges.
  </div>
  <p>This text is pushed down by the div's bottom margin.</p>
</body>
</html>
