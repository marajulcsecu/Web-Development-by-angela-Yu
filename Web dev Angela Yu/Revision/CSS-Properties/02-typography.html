<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      2. Typography
      Properties controlling how text looks.
    */
    .text-demo {
      font-family: Arial, sans-serif; /* Typeface */
      font-size: 24px;                /* Size of text */
      font-weight: bold;              /* Thickness (bold, normal, 100-900) */
      text-align: center;             /* Alignment: left, right, center */
      text-transform: uppercase;      /* ALL CAPS, lowercase, capitalize */
      line-height: 1.5;               /* Spacing between lines */
      letter-spacing: 2px;            /* Space between letters */
    }
  </style>
</head>
<body>
  <h1>Typography</h1>
  <p class="text-demo">
    This paragraph has custom font, size, weight, and center alignment.
    <br>It also has a line-height of 1.5 making it easier to read.
  </p>
</body>
</html>
