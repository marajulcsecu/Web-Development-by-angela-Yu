<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      1. Colors and Backgrounds
      'color' changes the text color.
      'background-color' changes the background.
      You can use names (red), HEX (#ff0000), or rgb/rgba.
    */
    .box {
      background-color: #3f51b5; /* Blue background */
      color: white;              /* White text */
      padding: 20px;
    }
    .warning {
      background-color: rgba(255, 0, 0, 0.2); /* Red with 20% opacity */
      color: #d32f2f; /* Dark red text */
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Colors & Backgrounds</h1>
  <div class="box">This div has a HEX background color and white text.</div>
  <br>
  <div class="warning">This div uses RGBA for a transparent background.</div>
</body>
</html>
