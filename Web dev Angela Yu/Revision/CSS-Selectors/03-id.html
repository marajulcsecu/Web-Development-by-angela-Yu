<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      3. ID Selector 
      Targets ONE specific element with a unique ID attribute. 
      Starts with a hash/pound sign (#).
    */
    #unique-title {
      color: red;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- IDs must be unique per page -->
  <h1 id="unique-title">My Unique Title</h1>
  <h1>A normal Title</h1>
</body>
</html>
