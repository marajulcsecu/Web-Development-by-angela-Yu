<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      1. Element Selector 
      Targets all elements of a specific tag name.
      Here, EVERY <p> tag will get a blue text color.
    */
    p {
      color: blue;
    }
  </style>
</head>
<body>
  <h1>Element Selector</h1>
  <!-- Both paragraphs will be styled -->
  <p>This is paragraph one.</p>
  <p>This is paragraph two.</p>
  <div>This is a div, so it is not affected.</div>
</body>
</html>
