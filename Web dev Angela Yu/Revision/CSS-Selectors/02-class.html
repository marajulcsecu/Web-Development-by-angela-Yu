<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      2. Class Selector 
      Targets elements with a specific class attribute. 
      Starts with a dot (.).
    */
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h1>Class Selector</h1>
  <p class="highlight">This paragraph has the 'highlight' class.</p>
  <p>This paragraph does not have the class.</p>
</body>
</html>
