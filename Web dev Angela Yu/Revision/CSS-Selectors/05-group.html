<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      5. Group Selector 
      Applies the same styles to multiple different selectors.
      Separated by commas (,).
    */
    h1, h2, .accent {
      font-family: Arial, sans-serif;
      color: purple;
    }
  </style>
</head>
<body>
  <h1>Heading 1 (affected)</h1>
  <h2>Heading 2 (affected)</h2>
  <h3>Heading 3 (NOT affected)</h3>
  <p class="accent">Paragraph with .accent class (affected)</p>
</body>
</html>
