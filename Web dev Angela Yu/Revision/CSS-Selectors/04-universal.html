<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* 
      4. Universal Selector 
      Targets EVERY single element on the page. 
      Uses the asterisk (*).
    */
    * {
      border: 1px solid green;
    }
  </style>
</head>
<body>
  <h1>Everything has a green border!</h1>
  <p>Even this paragraph.</p>
  <div>
    <span>And this span inside a div!</span>
  </div>
</body>
</html>
